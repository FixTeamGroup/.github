<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" height="100%">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- F -->
    <!-- Top cyan pill -->
    <path d="M 38 42 L 140 42" stroke="#00F0FF" stroke-width="16" filter="url(#neon)" />
    <!-- Lower F: vertical down then corner or straight down and small horizontal -->
    <path d="M 38 42 L 38 158" stroke="#FFFFFF" stroke-width="16" />
    <path d="M 38 100 L 115 100" stroke="#FFFFFF" stroke-width="16" />

    <!-- I -->
    <path d="M 195 42 L 195 158" stroke="#FFFFFF" stroke-width="16" />

    <!-- X (two facing bezier curves) -->
    <path d="M 260 42 C 295 85 295 115 260 158" fill="none" stroke="#FFFFFF" stroke-width="16" />
    <path d="M 345 42 C 310 85 310 115 345 158" fill="none" stroke="#FFFFFF" stroke-width="16" />

    <!-- SPACE -->

    <!-- T -->
    <path d="M 415 42 L 505 42" stroke="#FFFFFF" stroke-width="16" />
    <path d="M 460 52 L 460 158" stroke="#FFFFFF" stroke-width="16" />

    <!-- E (Three horizontal pills) -->
    <path d="M 545 42 L 635 42" stroke="#FFFFFF" stroke-width="16" />
    <path d="M 545 100 L 635 100" stroke="#00F0FF" stroke-width="16" filter="url(#neon)" />
    <path d="M 545 158 L 635 158" stroke="#FFFFFF" stroke-width="16" />

    <!-- A -->
    <path d="M 675 158 L 735 42 Q 740 32 745 42 L 805 158" fill="none" stroke="#FFFFFF" stroke-width="16" />
    <circle cx="740" cy="122" r="15" fill="#00F0FF" filter="url(#neon)" />

    <!-- M -->
    <path d="M 850 158 L 850 42 L 900 112 L 950 42 L 950 158" fill="none" stroke="#FFFFFF" stroke-width="16" />
  </g>
</svg>